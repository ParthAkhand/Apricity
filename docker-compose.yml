services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apricity
      POSTGRES_PASSWORD: apricity
      POSTGRES_DB: apricity
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apricity"]
      interval: 5s
      retries: 10
  api:
    build: { context: ., args: { APP: api } }
    # Dev convenience: migrate and seed on every start. The seed is idempotent.
    command: sh -c "npm run db:deploy -w @apricity/api && npm run db:seed -w @apricity/api && npm start -w @apricity/api"
    environment:
      DATABASE_URL: postgresql://apricity:apricity@db:5432/apricity
      WEB_ORIGIN: http://localhost:3000
      SESSION_SECRET: dev-only-compose-secret-change-for-real-deployments
      ADMIN_EMAIL: admin@apricity.local
      ADMIN_PASSWORD: Apricity-Dev-2026
    ports: ["4000:4000"]
    depends_on: { db: { condition: service_healthy } }
  web:
    build: { context: ., args: { APP: web, NEXT_PUBLIC_API_URL: "http://localhost:4000" } }
    environment:
      API_URL: http://api:4000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
