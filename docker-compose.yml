services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apricity
      POSTGRES_PASSWORD: apricity
      POSTGRES_DB: apricity
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apricity"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
